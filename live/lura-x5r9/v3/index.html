const mcConfetti=(n=140)=>{try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(x){}const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20';document.body.appendChild(c);const d=devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*d;c.height=H*d;const x=c.getContext('2d');x.scale(d,d);const col=['#075683','#8fcaec','#edf3f7','#ffffff','#12304a','#6f8a6a'];const P=[];for(let i=0;i<n;i++){const left=i%2===0;P.push({x:left?-10:W+10,y:H*0.55+Math.random()*H*0.2,vx:(left?1:-1)*(4+Math.random()*7),vy:-(9+Math.random()*9),r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:6+Math.random()*6,h:3+Math.random()*5,c:col[i%col.length]})}const t0=performance.now();const tick=t=>{const e=t-t0;x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-e/2600);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(e<2600)requestAnimationFrame(tick);else c.remove()};requestAnimationFrame(tick)};

<script>

const onScroll=e=>{const t=tgt();if((e.target===t||(t===document.scrollingElement&&e.target===document))&&t.scrollTop>30){used=true;H.classList.remove('on')}};
document.addEventListener('scroll',onScroll,true);
const mo=new MutationObserver(()=>{last=tgt();used=false;setTimeout(check,350)});
const start=()=>{['sh','box','view'].forEach(id=>{const el=document.getElementById(id);if(el)mo.observe(el,{childList:true,attributes:id==='sh',attributeFilter:id==='sh'?['class']:undefined})});setTimeout(check,900)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
window.addEventListener('resize',check);
})();
