let cur='today';
let railT=null,railHold=0;

 if(t.dataset.m){m=t.dataset.m;open(`<h3>${MOMS[m][0]}</h3><div class="say"><small>Say this</small><b>${esc(SAY[m])}</b></div><button class="btn p" id="qr">Show my QR code</button><div class="rule2">${RULE}</div><div style="font-size:13px;font-weight:700;color:#7a6d60;margin-top:4px">Not in person? Send the link</div><input id="nm" placeholder="Resident first name" autocomplete="off"><div class="msg" id="mg"></div><button class="btn g" id="copy">Copy for resident email (with subject)</button><button class="btn g" id="send">Or send from my own phone</button><button class="btn g" id="cx">Cancel</button>`);$('mg').textContent=txt();$('nm').addEventListener('input',()=>$('mg').textContent=txt())}
 if(t.id==='bCap')open(`<h3>📸 Snap for Social</h3><p style="margin:0;color:#4d4239;font-size:15px">Your photos and videos go straight to TheSocialDM. We pick the best shots, design them, write the captions and post them on Montage social media.</p><div class="rule2"><b>Great shots:</b> local spots, resident events, amenities, anything new or seasonal. Hold the phone vertical. Keep faces, kids, unit numbers and license plates out unless the person said yes.</div><a class="btn p" href="${esc((D&&D.uploadUrl)||'#')}" target="_blank" rel="noopener" style="display:grid;place-items:center;text-decoration:none">📤 Upload photos and videos</a><p style="margin:0;font-size:13px;color:#7a6d60;text-align:center">Opens a secure Dropbox upload page. It asks for your name and email, no Dropbox account needed. Tip: text TheSocialDM the spot or event after you upload.</p><button class="btn g" id="cx">Close</button>`);

 if(t.id==='bKit'){openKit();return}
